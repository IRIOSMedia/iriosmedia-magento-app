; PHP-FPM worker pool. Values in ${...} come from the environment (docker-compose.yml, from .env).
; Each worker can use up to memory_limit, so the number of workers is what decides the memory PHP needs.
;   Standard server (8 GB):     pm = dynamic,  max_children = 10
;   Small test server (2 GB):   pm = ondemand, max_children = 3, process_idle_timeout = 30s
[www]
pm = ${PHP_FPM_PM}
pm.max_children = ${PHP_FPM_MAX_CHILDREN}
pm.start_servers = ${PHP_FPM_START_SERVERS}
pm.min_spare_servers = ${PHP_FPM_MIN_SPARE_SERVERS}
pm.max_spare_servers = ${PHP_FPM_MAX_SPARE_SERVERS}
pm.process_idle_timeout = ${PHP_FPM_IDLE_TIMEOUT}
pm.max_requests = 500
